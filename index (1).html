  * {
    box-sizing: border-box;
  }

  html, body {
    overflow-x: hidden;
    max-width: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, var(--bg-alt), var(--bg) 70%);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }

  .app-container {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 1.5rem 1rem 3rem;
  }

  .starfield {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.22;
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px, #f5f0ff, transparent),
      radial-gradient(1.5px 1.5px at 140px 80px, #d7b0d5, transparent),
      radial-gradient(1px 1px at 300px 150px, #f5f0ff, transparent),
      radial-gradient(1px 1px at 400px 60px, #d7b0d5, transparent),
      radial-gradient(1.5px 1.5px at 60px 200px, #f5f0ff, transparent),
      radial-gradient(1px 1px at 220px 250px, #d7b0d5, transparent),
      radial-gradient(1px 1px at 500px 300px, #f5f0ff, transparent),
      radial-gradient(1.5px 1.5px at 350px 400px, #d7b0d5, transparent);
    background-repeat: repeat;
    background-size: 550px 450px;
    animation: starTwinkle 8s ease-in-out infinite alternate;
  }

  @keyframes starTwinkle {
    0% {
      opacity: 0.14;
    }
    100% {
      opacity: 0.32;
    }
  }

  .site-header {
    text-align: center;
    margin-bottom: 1.5rem;
  }

  .theme-switcher {
    display: flex;
    justify-content: center;
    margin-bottom: 1rem;
  }

  .theme-fieldset {
    border: none;
    padding: 0;
    margin: 0;
  }

  .theme-options {
    gap: 0.5rem;
  }

  .site-header h1 {
    font-family: 'Instrument Serif', Georgia, serif;
    font-weight: 400;
    font-size: 2.1rem;
    letter-spacing: 0.02em;
    margin: 0 0 0.35rem;
    color: var(--accent-soft);
  }

  .subtitle {
    color: var(--text-muted);
    margin: 0;
    font-size: 0.95rem;
  }

  .controls {
    background: rgba(176, 141, 202, 0.05);
    border: 1px solid var(--surface-border);
    border-radius: 12px;
    padding: 1.25rem;
  }

  fieldset.mode-fieldset {
    border: none;
    padding: 0;
    margin: 0;
  }

  legend {
    font-weight: 600;
    padding: 0;
    margin-bottom: 0.6rem;
    color: var(--text);
    font-size: 1rem;
  }

  .mode-options {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
  }

  .mode-option {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 1rem;
    border: 2px solid var(--surface-border);
    border-radius: 8px;
    cursor: pointer;
    min-height: 44px;
    background: var(--surface);
    color: var(--text-muted);
    transition: border-color 0.15s, background-color 0.15s, color 0.15s, transform 0.15s, box-shadow 0.15s;
  }

  .mode-option:hover {
    transform: scale(1.02);
    box-shadow: 0 0 10px rgba(176, 141, 202, 0.35);
  }

  .mode-option input {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
    margin: -1px;
  }

  .mode-option.is-checked {
    border-color: var(--accent);
    background: rgba(176, 141, 202, 0.14);
    color: var(--text);
  }

  .mode-option:focus-within {
    outline: 3px solid var(--accent-soft);
    outline-offset: 2px;
  }

  .quantity-control {
    margin-top: 1.35rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    max-width: 420px;
  }

  .quantity-control > label {
    font-weight: 600;
  }

  .quantity-inputs {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  #quantity-range {
    flex: 1;
    min-height: 44px;
  }

  #quantity-number {
    width: 4.75rem;
    padding: 0.5rem;
    border-radius: 6px;
    border: 2px solid var(--surface-border);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    min-height: 44px;
  }

  #quantity-number:focus-visible,
  #quantity-range:focus-visible {
    outline: 3px solid var(--accent-soft);
    outline-offset: 2px;
  }

  .action-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-top: 1.35rem;
  }

  .btn {
    font: inherit;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    border: 2px solid transparent;
    cursor: pointer;
    min-height: 44px;
    min-width: 44px;
    font-weight: 600;
    transition: background-color 0.15s, transform 0.15s, box-shadow 0.15s;
  }

  .btn:hover:not(:disabled) {
    transform: scale(1.03);
    box-shadow: 0 0 14px rgba(176, 141, 202, 0.45);
  }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-contrast);
  }

  .btn-primary:hover {
    background: var(--accent-soft);
  }

  .btn-secondary {
    background: transparent;
    border-color: var(--accent);
    color: var(--accent-soft);
  }

  .btn-secondary:hover {
    background: rgba(176, 141, 202, 0.15);
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .btn:focus-visible {
    outline: 3px solid var(--accent-soft);
    outline-offset: 3px;
  }

  .shuffle-indicator {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    padding: 2rem 0;
  }

  .shuffle-indicator[hidden] {
    display: none;
  }

  .shuffle-deck {
    position: relative;
    width: 90px;
    height: 130px;
  }

  .shuffle-card {
    position: absolute;
    inset: 0;
    border-radius: 8px;
    background: linear-gradient(135deg, #1e1d4b, #3f3257);
    border: 2px solid var(--accent);
    box-shadow: 0 0 14px rgba(176, 141, 202, 0.5);
  }

  .shuffle-card.c1 { animation: shuffleMove1 0.7s ease-in-out infinite; }
  .shuffle-card.c2 { animation: shuffleMove2 0.7s ease-in-out infinite; animation-delay: 0.05s; }
  .shuffle-card.c3 { animation: shuffleMove3 0.7s ease-in-out infinite; animation-delay: 0.1s; }

  @keyframes shuffleMove1 {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    50% { transform: translateX(-16px) rotate(-8deg); }
  }
  @keyframes shuffleMove2 {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-12px) rotate(3deg); }
  }
  @keyframes shuffleMove3 {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    50% { transform: translateX(16px) rotate(8deg); }
  }

  .shuffle-text {
    color: var(--text-muted);
    margin: 0;
    font-weight: 600;
  }

  .results {
    margin-top: 2rem;
  }

  .empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 2rem 0;
  }

  .results-count {
    color: var(--text-muted);
    font-weight: 600;
    margin: 0 0 1rem;
  }

  .results-count[hidden] {
    display: none;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 1rem;
  }

  .cards-grid[hidden] {
    display: none;
  }

  @media (min-width: 600px) {
    .cards-grid {
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1.25rem;
    }
  }

  @media (min-width: 1024px) {
    .cards-grid {
      gap: 1.5rem;
    }
  }

  .card {
    position: relative;
    aspect-ratio: 2 / 3.3;
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
    border-radius: 10px;
    min-height: 44px;
    perspective: 1000px;
    animation: cardEnter 350ms ease-out both;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .card:hover {
    transform: scale(1.03);
    box-shadow: 0 0 14px rgba(215, 176, 213, 0.4);
  }

  .card:focus-visible {
    outline: 3px solid var(--accent-soft);
    outline-offset: 4px;
    border-radius: 12px;
    box-shadow: 0 0 14px rgba(215, 176, 213, 0.4);
  }

  @keyframes cardEnter {
    from {
      opacity: 0;
      transform: translateY(8px) scale(0.96);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .card-inner {
    position: absolute;
    inset: 0;
    display: block;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
  }

  .card[aria-pressed="true"] .card-inner {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0.5rem;
    text-align: center;
    gap: 0.3rem;
  }

  .card-back {
    background: var(--surface);
    border: 2px solid var(--surface-border);
  }

  .card-back svg {
    width: 100%;
    height: 100%;
  }

  .card-front {
    background: linear-gradient(160deg, var(--surface), var(--bg-alt));
    transform: rotateY(180deg);
    border: 2px solid var(--accent);
    color: var(--text);
  }

  .card-index-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
  }

  .card-name {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 1.05rem;
    font-weight: 400;
    letter-spacing: 0.01em;
    line-height: 1.25;
    word-break: break-word;
  }

  .card-keywords {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
    word-break: break-word;
  }

  .card-divider {
    display: block;
    width: 65%;
    height: 1px;
    background: var(--surface-border);
    opacity: 0.4;
  }

  .card-meaning {
    font-style: italic;
    font-size: 0.65rem;
    font-weight: 400;
    color: var(--text-muted);
    line-height: 1.3;
    word-break: break-word;
  }

  .card-suit-icon,
  .card-major-icon {
    width: 28px;
    height: 28px;
    color: var(--accent);
  }

  .app-footer {
    text-align: center;
    margin-top: 2.5rem;
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }

    .card {
      animation-delay: 0ms !important;
    }
  }

        var buffer = new Uint32Array(1);
        var x;
        do {
          window.crypto.getRandomValues(buffer);
          x = buffer[0];
        } while (x > limit);
        return x % maxExclusive;
      }
      return Math.floor(Math.random() * maxExclusive);
    }

    function fisherYatesShuffle(array) {
      var a = array.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = secureRandomInt(i + 1);
        var tmp = a[i];
        a[i] = a[j];
        a[j] = tmp;
      }
      return a;
    }

    function prefersReducedMotion() {
      return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    }

    function clampQuantity(value, max) {
      var n = parseInt(value, 10);
      if (isNaN(n)) {
        n = 3;
      }
      n = Math.min(max, Math.max(1, n));
      return n;
    }

    function loadSettings() {
      try {
        var raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          return null;
        }
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') {
          return parsed;
        }
      } catch (e) {
        // localStorage indisponível ou dado corrompido: segue com padrões.
      }
      return null;
    }

    function saveSettings() {
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify({
          mode: state.mode,
          quantity: state.quantity,
          theme: state.theme
        }));
      } catch (e) {
        // Persistência é opcional; falha silenciosa não afeta o app.
      }
    }

    var state = {
      mode: 'both',
      quantity: 3,
      theme: 'light',
      drawnCards: []
    };

    var modeFieldset = document.querySelector('fieldset.mode-fieldset');
    var modeOptionsEl = document.getElementById('mode-options');
    var themeOptionsEl = document.getElementById('theme-options');
    var quantityLabel = document.getElementById('quantity-label');
    var quantityNumber = document.getElementById('quantity-number');
    var quantityRange = document.getElementById('quantity-range');
    var drawBtn = document.getElementById('draw-btn');
    var reshuffleBtn = document.getElementById('reshuffle-btn');
    var revealAllBtn = document.getElementById('reveal-all-btn');
    var shuffleIndicator = document.getElementById('shuffle-indicator');
    var emptyState = document.getElementById('empty-state');
    var resultsCount = document.getElementById('results-count');
    var cardsGrid = document.getElementById('cards-grid');
    var statusEl = document.getElementById('status-announcer');

    function announce(message) {
      statusEl.textContent = '';
      window.requestAnimationFrame(function () {
        statusEl.textContent = message;
      });
    }

    function updateOptionStyles(container) {
      var labels = container.querySelectorAll('.mode-option');
      labels.forEach(function (label) {
        var input = label.querySelector('input');
        if (input.checked) {
          label.classList.add('is-checked');
        } else {
          label.classList.remove('is-checked');
        }
      });
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
    }

    function updateQuantityMaxForMode(mode) {
      var max = MODE_MAX_QUANTITY[mode];
      quantityRange.max = String(max);
      quantityNumber.max = String(max);
      quantityLabel.textContent = 'Quantidade de cartas (1 a ' + max + ')';
      var clamped = clampQuantity(state.quantity, max);
      state.quantity = clamped;
      quantityNumber.value = clamped;
      quantityRange.value = clamped;
    }

    function onModeChange(event) {
      if (event.target && event.target.name === 'mode') {
        state.mode = event.target.value;
        updateOptionStyles(modeOptionsEl);
        updateQuantityMaxForMode(state.mode);
        saveSettings();
      }
    }

    function onThemeChange(event) {
      if (event.target && event.target.name === 'theme') {
        state.theme = event.target.value;
        applyTheme(state.theme);
        updateOptionStyles(themeOptionsEl);
        saveSettings();
      }
    }

    function onNumberChange() {
      var clamped = clampQuantity(quantityNumber.value, MODE_MAX_QUANTITY[state.mode]);
      quantityNumber.value = clamped;
      quantityRange.value = clamped;
      state.quantity = clamped;
      saveSettings();
    }

    function onRangeInput() {
      var clamped = clampQuantity(quantityRange.value, MODE_MAX_QUANTITY[state.mode]);
      quantityRange.value = clamped;
      quantityNumber.value = clamped;
      state.quantity = clamped;
      saveSettings();
    }

    function toggleActionButtons(disabled) {
      drawBtn.disabled = disabled;
      reshuffleBtn.disabled = disabled;
      revealAllBtn.disabled = disabled;
    }

    function toggleControlsDisabled(disabled) {
      modeFieldset.disabled = disabled;
      quantityNumber.disabled = disabled;
      quantityRange.disabled = disabled;
    }

    function toggleFlip(button, card, index, total) {
      var revealed = button.getAttribute('aria-pressed') === 'true';
      var next = !revealed;
      button.setAttribute('aria-pressed', String(next));
      if (next) {
        button.setAttribute('aria-label', 'Carta ' + (index + 1) + ' de ' + total + ': ' + card.name + '. ' + card.keywords + ' ' + card.meaning + ' Ativar para ocultar novamente.');
        announce('Carta ' + (index + 1) + ' revelada: ' + card.name + '. ' + card.keywords + ' ' + card.meaning);
      } else {
        button.setAttribute('aria-label', 'Carta ' + (index + 1) + ' de ' + total + ', oculta. Ative para revelar.');
      }
    }

    function buildCardButton(card, index, total) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'card';
      button.setAttribute('aria-pressed', 'false');
      button.dataset.cardId = card.id;
      button.setAttribute('aria-label', 'Carta ' + (index + 1) + ' de ' + total + ', oculta. Ative para revelar.');
      if (!prefersReducedMotion()) {
        button.style.animationDelay = Math.min(index * CARD_ENTER_STAGGER_MS, CARD_ENTER_MAX_DELAY_MS) + 'ms';
      }

      var inner = document.createElement('span');
      inner.className = 'card-inner';

      var back = document.createElement('span');
      back.className = 'card-face card-back';
      back.innerHTML = CARD_BACK_SVG;

      var front = document.createElement('span');
      front.className = 'card-face card-front';

      var indexLabel = document.createElement('span');
      indexLabel.className = 'card-index-label';
      indexLabel.textContent = 'Carta ' + (index + 1);

      var nameEl = document.createElement('span');
      nameEl.className = 'card-name';
      nameEl.textContent = card.name;

      var iconWrap = document.createElement('span');
      iconWrap.setAttribute('aria-hidden', 'true');
      if (card.arcana === 'minor') {
        iconWrap.className = 'card-suit-icon';
        iconWrap.innerHTML = SUIT_ICONS[card.suit];
      } else {
        iconWrap.className = 'card-major-icon';
        iconWrap.innerHTML = MAJOR_ICON_SVG;
      }

      var keywordsEl = document.createElement('span');
      keywordsEl.className = 'card-keywords';
      keywordsEl.textContent = card.keywords;

      var dividerEl = document.createElement('span');
      dividerEl.className = 'card-divider';
      dividerEl.setAttribute('aria-hidden', 'true');

      var meaningEl = document.createElement('span');
      meaningEl.className = 'card-meaning';
      meaningEl.textContent = card.meaning;

      front.appendChild(indexLabel);
      front.appendChild(iconWrap);
      front.appendChild(nameEl);
      front.appendChild(keywordsEl);
      front.appendChild(dividerEl);
      front.appendChild(meaningEl);

      inner.appendChild(back);
      inner.appendChild(front);
      button.appendChild(inner);

      button.addEventListener('click', function () {
        toggleFlip(button, card, index, total);
      });

      return button;
    }

    function renderResults(drawnCards) {
      cardsGrid.innerHTML = '';
      var total = drawnCards.length;
      drawnCards.forEach(function (card, index) {
        cardsGrid.appendChild(buildCardButton(card, index, total));
      });
    }

    function performDraw() {
      var pool = getPool(state.mode);
      var shuffled = fisherYatesShuffle(pool);
      var drawn = shuffled.slice(0, state.quantity);
      state.drawnCards = drawn;
      return drawn;
    }

    function finishDraw(drawn) {
      renderResults(drawn);
      emptyState.hidden = true;
      resultsCount.textContent = drawn.length + (drawn.length > 1 ? ' cartas sorteadas' : ' carta sorteada');
      resultsCount.hidden = false;
      cardsGrid.hidden = false;
      reshuffleBtn.hidden = false;
      revealAllBtn.hidden = false;
      toggleActionButtons(false);
      toggleControlsDisabled(false);
      announce('Tiragem de ' + drawn.length + (drawn.length > 1 ? ' cartas realizada' : ' carta realizada') + '. Toque ou pressione Enter em cada carta para revelar.');
    }

    function startDrawFlow() {
      toggleActionButtons(true);
      toggleControlsDisabled(true);
      emptyState.hidden = true;
      var reduced = prefersReducedMotion();
      if (reduced) {
        var drawnNow = performDraw();
        finishDraw(drawnNow);
        return;
      }
      cardsGrid.hidden = true;
      shuffleIndicator.hidden = false;
      shuffleIndicator.setAttribute('aria-hidden', 'false');
      window.setTimeout(function () {
        var drawn = performDraw();
        shuffleIndicator.hidden = true;
        shuffleIndicator.setAttribute('aria-hidden', 'true');
        finishDraw(drawn);
      }, SHUFFLE_ANIMATION_MS);
    }

    function onRevealAll() {
      var buttons = cardsGrid.querySelectorAll('.card');
      var total = state.drawnCards.length;
      buttons.forEach(function (button, index) {
        if (button.getAttribute('aria-pressed') !== 'true') {
          var card = state.drawnCards[index];
          button.setAttribute('aria-pressed', 'true');
          button.setAttribute('aria-label', 'Carta ' + (index + 1) + ' de ' + total + ': ' + card.name + '. ' + card.keywords + ' ' + card.meaning);
        }
      });
      announce('Todas as cartas foram reveladas.');
    }

    function init() {
      var saved = loadSettings();
      if (saved) {
        if (saved.mode === 'major' || saved.mode === 'minor' || saved.mode === 'both') {
          state.mode = saved.mode;
        }
        if (typeof saved.quantity !== 'undefined') {
          state.quantity = saved.quantity;
        }
        if (saved.theme === 'light' || saved.theme === 'dark') {
          state.theme = saved.theme;
        }
      }

      var modeInput = document.querySelector('input[name="mode"][value="' + state.mode + '"]');
      if (modeInput) {
        modeInput.checked = true;
      }
      updateOptionStyles(modeOptionsEl);

      var themeInput = document.querySelector('input[name="theme"][value="' + state.theme + '"]');
      if (themeInput) {
        themeInput.checked = true;
      }
      applyTheme(state.theme);
      updateOptionStyles(themeOptionsEl);

      updateQuantityMaxForMode(state.mode);

      modeOptionsEl.addEventListener('change', onModeChange);
      themeOptionsEl.addEventListener('change', onThemeChange);
      quantityNumber.addEventListener('change', onNumberChange);
      quantityRange.addEventListener('input', onRangeInput);
      drawBtn.addEventListener('click', startDrawFlow);
      reshuffleBtn.addEventListener('click', startDrawFlow);
      revealAllBtn.addEventListener('click', onRevealAll);
    }

    init();
  })();
  </script>
</body>
</html>
